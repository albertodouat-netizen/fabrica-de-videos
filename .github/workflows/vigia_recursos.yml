name: Vigia de recursos (prueba el arsenal de IA cada semana)

# AGENTE 35 (creado 19-ago-2026 tras el desastre de Groq/Gemini):
# prueba EN VIVO, una vez por semana, que todos los proveedores gratuitos
# del arsenal sigan funcionando (Groq, Gemini, Mistral, OpenRouter, NVIDIA,
# Pexels, Pixabay, Cloudflare, Pollinations, Jamendo, edge-tts, EuropePMC).
#
# CÓMO TE LLEGA LA ALERTA: si detecta una falla CRÍTICA (por ejemplo, que
# ningún proveedor de guion responde, o que no hay ninguna fuente de
# imágenes viva), el workflow TERMINA EN ERROR a propósito y GitHub te
# envía el correo automático "Vigia de recursos: failed". Si todo está
# bien, termina en verde y no molesta.
#
# Corre los lunes a las 12:00 UTC (7:00 am Colombia), lejos de las corridas
# de publicación (19:30 / 21:45 UTC) y del vigilante (13:00 UTC).

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias minimas
        run: pip install pyyaml requests edge-tts

      - name: Preparar configuracion con las llaves
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cp config/config.example.yaml config/config.yaml
          python3 scripts/aplicar_secretos.py

      - name: Probar el arsenal EN VIVO
        run: python3 scripts/vigia_recursos.py
