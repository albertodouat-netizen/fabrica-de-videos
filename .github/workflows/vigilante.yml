name: Vigilante de publicaciones (te avisa si el robot no publico)

# Corre una vez al día a las 13:00 UTC (8:00 am en Colombia), una hora
# MUY distinta de las corridas de publicación (19:30 y 21:45 UTC), para
# que un salto de cron de GitHub no afecte a ambos a la vez.
#
# CÓMO TE LLEGA LA ALERTA: si el robot lleva demasiados días sin publicar,
# este workflow TERMINA EN ERROR a propósito, y GitHub le envía al dueño
# del repositorio un correo automático ("Vigilante de publicaciones:
# failed") y una notificación push si tiene la app de GitHub instalada en
# el celular. Si todo está bien, termina en verde y no molesta.
#
# Requisito para que lleguen los avisos (una sola vez, 1 minuto):
# GitHub -> foto de perfil -> Settings -> Notifications -> sección
# "Actions": marcar "Notify for failed workflows only" (suele venir
# activado por defecto) con Email activado.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Revisar si el robot ha publicado cuando tocaba
        run: python3 scripts/vigilante_publicaciones.py
