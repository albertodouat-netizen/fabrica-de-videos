name: Fabrica de Videos YouTube (100% gratis y automatico)

# Se ejecuta solo, sin que toques nada, según el horario definido abajo.
# GitHub Actions da GRATIS ~2000 minutos/mes en repos privados (e ilimitado
# en repos públicos). AVISO (actualizado tras subir el objetivo de duración
# a 15-20 min por video): al ser videos más largos, cada corrida ahora usa
# más tiempo (guion más extenso con varias rondas de "extensión" real,
# muchos más recursos visuales por video, más tiempo de renderizado). Si
# corres 1 video/día, esto se acerca más al límite gratuito mensual que
# antes; vigila la pestaña "Actions" de GitHub de vez en cuando (te avisa
# ahí mismo si te vas quedando sin minutos) y, si hace falta, baja
# `duracion_objetivo_min` en config.yaml o cambia el repositorio a público
# (minutos ilimitados) para tener más margen sin gastar nada de dinero.
on:
  schedule:
    # Hora elegida con base en investigación real de comportamiento de
    # audiencia en YouTube (agosto 2026): la ventana con mejor tráfico para
    # una audiencia hispanohablante es entre semana, 2pm-4pm hora LOCAL del
    # espectador. La PUBLICACIÓN la sigue haciendo YouTube solo, EXACTA a
    # las 19:30 UTC = 2:30 pm Colombia, mediante publishAt.
    #
    # REPROGRAMADO 31-ago-2026 (pedido explícito del usuario): la
    # GENERACIÓN debe arrancar MUCHO más temprano, a las 3:00 am Colombia,
    # para darle a la fábrica toda la madrugada y buena parte de la mañana.
    # 3:00 am Colombia = 08:00 UTC.
    #
    # FRECUENCIA: 1 video CADA 2 DÍAS. El cron corre todos los días, pero el
    # candado (scripts/verificar_si_ya_publico_hoy.py) solo deja publicar si
    # han pasado al menos 2 días desde el último largo.
    - cron: "0 8 * * *"
    # RESPALDO TEMPRANO: si GitHub se salta la corrida principal o la retrasa,
    # reintentar aún de madrugada/mañana conserva muchísimo margen antes de
    # las 2:30 pm. 10:15 UTC = 5:15 am Colombia.
    - cron: "15 10 * * *"
  workflow_dispatch: {}   # también puedes lanzarlo manualmente desde la pestaña "Actions"

# Evita corridas superpuestas del mismo workflow. Si la principal sigue viva
# cuando llega el horario de respaldo, la segunda queda en cola y arrancará
# solo cuando termine la primera. Esto evita duplicados y carreras entre dos
# generadores largos el mismo día.
concurrency:
  group: fabrica-videos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el robot recuerde qué ideas ya usó (commit automático)

jobs:
  generar_y_publicar_video:
    runs-on: ubuntu-latest
    # AMPLIADO 27-ago-2026 (fallo real: 2 corridas del 25-ago murieron con
    # "exceeded the maximum execution time of 1h50m0s" ensamblando el video;
    # los videos de 15+ min con las correcciones tardan más que los de 6-8
    # min de antes). Límite duro de GitHub por job: 6h.
    timeout-minutes: 360
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Restaurar credenciales secretas (nunca se suben al repo)
        env:
          # Reloj global (01-sep-2026): más margen real para generar antes
          # de entrar en modo apurado. OJO: GitHub Actions jamás permite
          # tiempo ilimitado; el máximo duro del job son 6h. Por eso este
          # presupuesto se sube a 240 min: 4h de trabajo pesado y ~2h de
          # colchón para render + subida antes de pegar contra el límite.
          PRESUPUESTO_MINUTOS: "240"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          TOKEN_JSON_B64: ${{ secrets.TOKEN_JSON_B64 }}
        run: |
          mkdir -p config
          cp config/config.example.yaml config/config.yaml
          echo "$CLIENT_SECRET_B64" | base64 -d > config/client_secret.json
          echo "$TOKEN_JSON_B64" | base64 -d > config/token.json
          python3 scripts/verificar_secretos.py
          python3 scripts/aplicar_secretos.py

      - name: Evitar doble publicación (candado del horario de respaldo)
        id: candado
        run: python3 scripts/verificar_si_ya_publico_hoy.py

      - name: Diagnostico - confirmar canal conectado (rapido, antes de gastar tiempo)
        if: steps.candado.outputs.ya_publico != 'true'
        run: python3 scripts/diagnostico_canal.py

      - name: Ejecutar el equipo de agentes (video largo + Short + publicación)
        if: steps.candado.outputs.ya_publico != 'true'
        run: python3 orchestrator.py --videos 1

      - name: Verificar que la corrida larga produjo publicación real
        if: steps.candado.outputs.ya_publico != 'true'
        run: python3 scripts/verificar_resultado_corrida.py --modo largo

      # Días sin video largo: ANTES de publicar un Short independiente,
      # revisar si quedó pendiente el Short derivado de un largo ya
      # publicado. Esto rescata casos "largo sí, short no" sin volver a
      # generar otro largo y evita que el canal publique un Short no
      # relacionado mientras el largo anterior sigue huérfano.
      - name: Detectar si hay Short derivado pendiente
        if: steps.candado.outputs.ya_publico == 'true'
        id: short_pendiente
        run: python3 scripts/detectar_short_pendiente.py

      - name: Reintentar Short derivado pendiente (si existe)
        if: steps.candado.outputs.ya_publico == 'true' && steps.short_pendiente.outputs.hay_pendiente == 'true'
        run: python3 orchestrator.py --solo-short-pendiente

      - name: Verificar que el Short derivado pendiente produjo resultado real
        if: steps.candado.outputs.ya_publico == 'true' && steps.short_pendiente.outputs.hay_pendiente == 'true'
        run: python3 scripts/verificar_resultado_corrida.py --modo short-pendiente

      # Solo si NO había ningún Short pendiente por rescatar, publicar el
      # Short independiente normal del día.
      - name: Short independiente (días sin video largo)
        if: steps.candado.outputs.ya_publico == 'true' && steps.short_pendiente.outputs.hay_pendiente != 'true'
        run: python3 orchestrator.py --solo-short-independiente

      - name: Verificar que la corrida de Short independiente produjo resultado real
        if: steps.candado.outputs.ya_publico == 'true' && steps.short_pendiente.outputs.hay_pendiente != 'true'
        run: python3 scripts/verificar_resultado_corrida.py --modo short-independiente

      - name: Responder comentarios de espectadores (interacción = algoritmo)
        if: always()
        continue-on-error: true
        run: python3 -c "import sys; sys.path.insert(0,'.'); from agents.responde_comentarios import responder_comentarios_pendientes; responder_comentarios_pendientes()"

      - name: Guardar video, miniatura y logs como respaldo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_number }}
          # CORRECCIÓN 28-ago-2026 (error real: "Artifact storage quota has
          # been hit"): ya NO se guarda el video completo (200-500 MB por
          # corrida x 14 días reventaba los 500 MB gratis de GitHub). El
          # video ya está en YouTube; aquí solo memoria, miniatura y logs.
          path: |
            data/estado.json
            output/resultado_corrida.json
            output/thumbnails/**
          retention-days: 5

      - name: Recordar ideas ya usadas (commit automático de la memoria)
        if: always()
        run: |
          git config user.name "Robot de YouTube"
          git config user.email "robot@localhost"
          git add data/estado.json
          git diff --cached --quiet || git commit -m "Actualiza memoria del robot [skip ci]"
          # CORRECCIÓN (fallo real del 14-ago-2026): si el repositorio recibió
          # commits DESPUÉS de que esta corrida empezó (por ejemplo, el usuario
          # subiendo un paquete de actualización mientras el robot generaba el
          # video), el push directo era rechazado ("fetch first") y el paso
          # fallaba. Ahora se trae lo nuevo con rebase (la memoria del robot
          # es un archivo que solo escribe el robot, así que no hay conflicto
          # real posible) y se reintenta el push hasta 3 veces.
          for intento in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push rechazado (intento $intento), reintentando en 10s..."
            sleep 10
          done
