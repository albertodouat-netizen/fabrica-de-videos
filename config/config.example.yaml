# ============================================================
# CONFIGURACIÓN CENTRAL DEL EQUIPO DE AGENTES
# Todo lo que necesitas rellenar está marcado con "OBTENER GRATIS AQUÍ"
# ============================================================

canal:
  nombre: "Salud Natural Diaria"   # <- cámbialo por el nombre real que le pongas a tu canal
  url: "https://www.youtube.com/channel/UCp96gCIthtbOAnhFpezcAHg"  # enlace directo a tu canal (para el CTA de suscripción en la descripción)
  idioma_destino: "es"          # idioma en el que se publica
  idioma_investigacion: "en"    # idioma donde se buscan ideas ganadoras (mercado más grande = más datos)
  # SEO multilingüe (gratis, recomendado por el experto de YouTube analizado):
  # agrega título+descripción TRADUCIDOS al mismo video (sin subir nada nuevo)
  # para que también aparezca en búsquedas en otros idiomas. Déjalo vacío []
  # para desactivarlo. Ejemplo: ["en", "de"] (inglés, alemán).
  idiomas_seo_adicionales: []
  nicho: "salud natural, alternativa, tradicional y complementaria (con respaldo científico)"
  # EJES TEMÁTICOS: reemplaza a la lista plana de palabras clave. Cada eje es
  # una categoría de salud distinta; el sistema ROTA entre ellas para que el
  # canal nunca se sienta repetitivo (YouTube penaliza el contenido siempre
  # igual) y además exige que cada idea tenga estudios científicos reales
  # disponibles antes de producirla (ver agents/investigacion_cientifica.py).
  # Alcance: remedios/terapias naturales, alternativas, tradicionales o
  # complementarias, Y recomendaciones que COMPLEMENTAN tratamientos médicos
  # científicos (nunca que los reemplacen) — siempre con evidencia real.
  ejes_tematicos:
    - categoria: "sueño y descanso"
      palabras_clave: ["natural sleep remedies", "how to sleep better naturally", "insomnia natural treatment"]
    - categoria: "salud digestiva e intestinal"
      palabras_clave: ["gut health tips", "natural remedies bloating", "improve digestion naturally"]
    - categoria: "inflamación y dolor articular"
      palabras_clave: ["how to reduce inflammation", "natural joint pain relief", "anti inflammatory habits"]
    - categoria: "sistema inmunológico"
      palabras_clave: ["boost immune system naturally", "natural immunity tips", "foods that boost immunity"]
    - categoria: "estrés y ansiedad"
      palabras_clave: ["natural stress relief", "reduce anxiety naturally", "adaptogens for stress"]
    - categoria: "salud cardiovascular"
      palabras_clave: ["natural ways lower blood pressure", "heart health natural remedies", "lower cholesterol naturally"]
    - categoria: "salud metabólica y glucosa"
      palabras_clave: ["natural ways lower blood sugar", "insulin resistance natural remedies", "metabolic health tips"]
    - categoria: "salud de la piel"
      palabras_clave: ["natural skin remedies", "skin inflammation natural treatment", "natural acne remedies"]
    - categoria: "terapias complementarias con evidencia"
      palabras_clave: ["yoga therapy benefits research", "meditation clinical benefits", "acupuncture evidence based"]
    - categoria: "remedios tradicionales estudiados científicamente"
      palabras_clave: ["turmeric curcumin research", "ginger health benefits research", "traditional herbal medicine evidence"]

estrategia:
  videos_por_semana: 4          # igual que recomienda el video analizado
  duracion_minima_min: 8        # minutos mínimos por video (RPM más alto con videos largos)
  duracion_objetivo_min: 15
  max_suscriptores_referencia: 250000   # canales de referencia con <250k subs = nicho "joven"/viral
  dias_publicado_max: 365               # solo mirar contenido de los últimos 12 meses
  ratio_minimo_vistas_subs: 3           # vistas >= 3x suscriptores => señal de nicho potente

apis:
  # --- YouTube Data API (GRATIS, cuota diaria gratuita generosa) ---
  # Obtener en: https://console.cloud.google.com/apis/library/youtube.googleapis.com
  youtube_api_key: "OBTENER_GRATIS_AQUI"
  # OAuth client (para poder SUBIR videos a TU canal) -> mismo Google Cloud Console
  # APIs & Services > Credentials > Create OAuth client ID > Desktop App
  # Descargar el JSON y ponerlo en config/client_secret.json
  oauth_client_secret_path: "config/client_secret.json"
  oauth_token_path: "config/token.json"

  # --- LLM gratuito para redactar guiones (elige UNO) ---
  # Opción recomendada: Google Gemini (capa gratuita generosa)
  #   Obtener en: https://aistudio.google.com/app/apikey
  llm_provider: "gemini"   # gemini | groq | ollama | none (usa plantilla local sin IA)
  gemini_api_key: "OBTENER_GRATIS_AQUI"
  # Alternativa gratuita: Groq (Llama 3 gratis, muy rápido)
  #   Obtener en: https://console.groq.com/keys
  groq_api_key: "OBTENER_GRATIS_AQUI"
  # Alternativa 100% local y gratuita, sin internet: Ollama (https://ollama.com)
  ollama_model: "llama3.1"

  # --- Banco de video/imágenes gratuito libre de derechos ---
  # Pexels: https://www.pexels.com/api/  (gratis, sin límite práctico)
  pexels_api_key: "OBTENER_GRATIS_AQUI"
  # Pixabay: https://pixabay.com/api/docs/ (gratis, backup si Pexels no tiene resultados)
  pixabay_api_key: "OBTENER_GRATIS_AQUI"

  # --- Música de fondo con licencia libre (opcional) ---
  # Jamendo: https://devportal.jamendo.com/ (gratis, registro de 2 min, sin tarjeta)
  # Solo se usan pistas con licencia que permite uso comercial (se filtra automáticamente).
  jamendo_client_id: "OBTENER_GRATIS_AQUI"

  # --- Voz (100% gratis, no requiere key: Microsoft Edge TTS) ---
  # Se elige AL AZAR una de estas 4 voces para cada video nuevo (variedad).
  voz_narrador_pool:
    - "es-CO-GonzaloNeural"    # Colombia, masculina
    - "es-MX-JorgeNeural"      # México, masculina
    - "es-US-AlonsoNeural"     # neutra (todo Latinoamérica), masculina
    - "es-MX-DaliaNeural"      # México, femenina
  # Si el guion se marca como "audiencia_exclusiva: mujeres" (temas como
  # menstruación, menopausia, embarazo), se usa SIEMPRE esta voz, sin azar:
  voz_narrador_exclusiva_mujeres: "es-MX-DaliaNeural"
  voz_narrador_rate: "-8%"    # ritmo (negativo = más lento/pausado = suena más natural y cálido)
  voz_narrador_pitch: "+0Hz"  # tono; no suele hacer falta tocarlo

publicacion:
  privacidad_default: "private"   # sube como privado/programado por seguridad; cambia a "public" cuando lo revises
  categoria_youtube: "22"         # People & Blogs (ver docs para otros IDs)
  programar_hora_utc: "14:00"     # hora sugerida de publicación
